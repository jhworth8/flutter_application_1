name: pickleball_round_robin
description: "Casual Pickleball Round Robin mini-app for on-the-fly doubles tournaments."
# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Reactive single-source-of-truth state container.
  flutter_bloc: ^8.1.3

  # Date / time formatting for the session archive.
  intl: ^0.19.0

  # Local non-volatile persistence for crash recovery (mobile + web).
  shared_preferences: ^2.2.2

  # Native share-sheet integration for distributing matchup / standings images.
  share_plus: ^7.2.2

  # iOS-style icons.
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
